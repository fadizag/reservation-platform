<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}منصة حجز الرحلات{% endblock %}</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-slate-100 min-h-screen"><header class="border-b border-slate-800"><div class="max-w-5xl mx-auto px-4 py-4 flex justify-between"><a href="/" class="font-bold">منصة حجز الرحلات</a>{% if user.is_authenticated %}<a href="{% url 'accounts:logout' %}" class="text-slate-400">خروج</a>{% endif %}</div></header><main class="max-w-5xl mx-auto px-4 py-8">{% if messages %}{% for message in messages %}<div class="mb-4 rounded-xl bg-slate-800 p-4">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main></body></html>
