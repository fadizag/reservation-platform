{% extends 'base.html' %}{% block title %}لوحة الراكب{% endblock %}{% block content %}<div class="flex justify-between items-center mb-8"><h1 class="text-3xl font-bold">رحلاتي</h1><a href="{% url 'reservations:create' %}" class="rounded-xl bg-white text-slate-950 px-5 py-3">حجز رحلة</a></div><div class="grid gap-4">{% for r in upcoming %}<a href="{% url 'reservations:detail' r.pk %}" class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><div class="flex justify-between"><b>{{ r.pickup }} ← {{ r.destination }}</b><span>{{ r.get_status_display }}</span></div><p class="text-slate-400 mt-2">{{ r.scheduled_time }}</p></a>{% empty %}<p class="text-slate-400">لا توجد حجوزات قادمة.</p>{% endfor %}</div>{% endblock %}
